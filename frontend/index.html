<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界历史地图 · World History Atlas</title>
<!-- 所有资源均为本地文件，运行时不依赖 CDN / 网络 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232b2118'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">世界历史地图 <span>World History Atlas</span></div>
  <div class="datebox">
    <label class="bc"><input type="checkbox" id="isBC"> 公元前</label>
    <input type="number" id="yearIn" min="1" max="123000" title="年份">
    <span>年</span>
    <select id="monthIn" title="月（可不选）"></select>
    <select id="dayIn" title="日（可不选）"></select>
    <button id="goBtn" title="跳转到这个日期">跳转</button>
    <button id="prevBtn" title="上一步（年或日）">◀</button>
    <button id="nextBtn" title="下一步（年或日）">▶</button>
    <button id="playBtn" title="播放 / 暂停">▶ 播放</button>
    <select id="speedIn" title="播放速度">
      <option value="900">慢</option><option value="450" selected>中</option><option value="180">快</option>
    </select>
  </div>
  <button id="todayBtn" title="跳到今天">今天</button>
  <button id="worldBtn" title="查看全世界在这一天前后的事件与人物">🌍 全世界</button>
  <button id="diploBtn" type="button" title="按所选日期列出还在的国际组织和会议体系">外交</button>
  <button id="aboutBtn">数据说明</button>
  <button id="styleBtn" type="button" aria-pressed="false" title="自己绘制的分区、边界和前线层次，参考策略游戏的读图方式。不是 TNO 或钢铁雄心的官方地图，也不使用那些游戏的图。">策略地图</button>
  <button id="quitBtn" type="button" title="退出软件。没有终端窗口时用这个按钮关闭。">退出</button>
  <span id="updateStatus"></span>
</header>

<main>
  <div id="map"></div>
  <aside id="panel" class="hidden">
    <div class="panel-head">
      <button id="closePanel" title="关闭">✕</button>
      <h2 id="polityName">—</h2>
      <div id="polityMeta"></div>
    </div>
    <nav id="tabs"></nav>
    <div id="tabBody"></div>
  </aside>
  <div id="eraNote"></div>
  <div id="mapKey">
    <button type="button" id="mapKeyBtn" aria-expanded="false">图例</button>
    <div id="mapKeyBody">
      <p><span class="swatch sw-border"></span>政权边界</p>
      <p><span class="swatch sw-occ"></span>占领或控制区（彩色边）。国名和控制区名称都只在写得进该范围时标出来，写不进就悬停或点选看全名</p>
      <p><span class="swatch sw-admin"></span>虚线小框是声索说明的样本，不是实际边界，也不表示实际控制。没有画出来的年代，不是把今天的实控倒回古代</p>
      <p><span class="swatch sw-gap"></span>灰色表示数据不足：不知道实控范围画到哪里。不是无人统治，也不是已经重建的实控线</p>
      <p><span class="swatch sw-front"></span>战争前线（打开图层后出现）</p>
      <p><span class="swatch sw-admin"></span>虚线是所选日期有来源的民国省界。没有合法数据的年份和地区不画，标省界待考。不画今天的省界，不是历史省界。</p>
      <p class="k-src">来源和许可写在地图角，也可打开「数据说明」。</p>
    </div>
  </div>
  <div id="legend"></div>
</main>

<footer id="timeline">
  <div id="dateLabel"></div>
  <input type="range" id="slider" min="0" max="10000" step="1">
  <div id="ticks"></div>
</footer>

<div id="econHover"></div>
<div id="about" class="modal hidden"><div class="modal-body">
  <button class="modal-close" id="aboutClose">✕</button>
  <h2>数据说明</h2>
  <div id="aboutBody"></div>
</div></div>

<!-- 详情窗口：人物页面 / 机构卡片 / 阵营面板（由模块脚本填充） -->
<div id="detail" class="modal hidden"><div class="modal-body detail-body">
  <button class="modal-close" id="detailClose">✕</button>
  <div id="detailBody"></div>
</div></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
<script>
document.getElementById("quitBtn").addEventListener("click", async () => {
  if (!confirm("退出世界历史地图？")) return;
  try {
    await fetch("/api/shutdown", {method: "POST", headers: {"X-WHA-Shutdown": "1"}});
  } catch (e) {}
  document.body.innerHTML = '<p style="font:16px/1.5 sans-serif;padding:24px">世界历史地图已退出。可以关闭这个标签页。</p>';
});
</script>
</body>
</html>
